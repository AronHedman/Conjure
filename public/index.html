<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conjure</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="gameContainer">

    <div id="resourceContainer" class="container">
      <div id="energyContainer" class="subResourceContainer">Energy: <span id="energyAmount">0/100</span>
        <button id="energyBtn" onclick="isGathering('energy')" class="button">Focus</button>
      </div>

      <div id="matterContainer" class="subResourceContainer">Matter: <span id="matterAmount">0/100</span>
        <button id="matterBtn" onclick="isGathering('matter')" class="button">Gather</button>
      </div>

    </div>

    <div id="upgradeContainer" class="container">

    </div>
  </div>
  <div id="footerContainer">

    <button onclick="save()" class="button">Save</button>
    <button onclick="loadGame()" class="button">Load</button>

  </div>
  <script src="save.js"></script>
  <script src="upgrades.js"></script>
  <script src="main.js"></script>
</body>

</html>
